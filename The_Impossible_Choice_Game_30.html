<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Impossible Choice – Game 30</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#28214f;background:radial-gradient(circle at 10% 10%,#ffe1ae,transparent 37%),radial-gradient(circle at 90% 15%,#c5e9ff,transparent 40%),#f6f0ff}.wrap{max-width:1060px;margin:auto;padding:22px}.top{text-align:center}.top small{font-weight:900;letter-spacing:2px;color:#7141c4}.top h1{font-size:clamp(33px,6vw,62px);color:#5b2bb1;margin:8px 0}.top p{font-size:18px;margin:0 0 20px}.panel{background:#fff;border-radius:28px;box-shadow:0 15px 45px #412c6b22;padding:25px}.toolbar,.scores,.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{margin-bottom:18px}.toolbar select{border:2px solid #ddd1f3;border-radius:12px;padding:10px;font-size:15px}.scores{font-weight:900;color:#665782}.round{font-weight:900;color:#7141c4;text-align:center;letter-spacing:1px}.scenario{text-align:center;font-size:clamp(24px,4vw,37px);margin:12px 0 22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{min-height:185px;border:4px solid transparent;border-radius:24px;padding:25px;font-size:clamp(19px,3vw,27px);font-weight:900;cursor:pointer;transition:transform .2s,border-color .2s}.choice:hover{transform:translateY(-5px)}.choice.a{background:linear-gradient(140deg,#e2f6ff,#b5e4fb);color:#175c9e}.choice.b{background:linear-gradient(140deg,#ffe3f0,#f9bce1);color:#a12e79}.choice.selected{border-color:#6b36c1;box-shadow:0 0 0 3px #eee3ff}.choice:disabled{cursor:default}.choice .letter{display:block;font-size:16px;margin-bottom:13px;opacity:.8}.challenge{margin:20px 0;background:#f1eaff;border-radius:19px;padding:20px;min-height:112px;line-height:1.55}.challenge h3{margin:0 0 8px;color:#6132b3}.challenge p{margin:6px 0}.btn{border:0;border-radius:13px;padding:13px 20px;background:#6939c1;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.btn.alt{background:#0da79e}.btn:disabled{opacity:.4;cursor:not-allowed}.note{font-size:14px;color:#716680;line-height:1.5}.end{text-align:center;padding:25px}.end h2{font-size:35px;color:#5b2bb1}.progress{height:11px;background:#eee6fb;border-radius:30px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#16aeb1,#9051cf);transition:width .3s}@media(max-width:640px){.choices{grid-template-columns:1fr}.choice{min-height:115px}.panel{padding:17px}.wrap{padding:12px}}
</style></head><body><div class="wrap"><header class="top"><small>PLAY • THINK • CREATE! | GAME 30</small><h1>🎭 THE IMPOSSIBLE CHOICE!</h1><p>Choose. Defend. Discover! · English speaking challenge</p></header><main class="panel"><div class="toolbar"><label><strong>Play mode:</strong> <select id="mode"><option value="solo">Individual</option><option value="teams">Two teams</option></select></label><span id="round" class="round">CHALLENGE 1 / 12</span><span id="score" class="scores">⭐ Score: 0</span></div><div class="progress"><div class="fill" id="fill"></div></div><div id="content"><h2 class="scenario" id="scenario"></h2><div class="choices"><button class="choice a" id="a"></button><button class="choice b" id="b"></button></div><div class="challenge" id="challenge" aria-live="polite"><h3>YOUR MISSION</h3><p>Choose A or B. Then explain your choice in English!</p></div><div class="actions"><button class="btn alt" id="award" disabled>⭐ Award speaking point</button><button class="btn" id="next" disabled>Next challenge →</button></div></div><div class="actions" style="margin-top:17px"><button class="btn alt" id="reset">↻ Restart</button><span class="note">No wrong choices! A teacher or partner awards one point for a clear explanation.</span></div></main></div><script>
const questions=[["THE TWO DOORS", "Travel 100 years into the future", "Understand every language", "Give two reasons for your choice.", "What might be one disadvantage of your choice?"], ["THE SCHOOL UPGRADE", "Have lessons outdoors every day", "Learn with a friendly robot teacher", "Explain how your choice would improve learning.", "What problem might your choice create?"], ["THE SECRET SUPERPOWER", "Pause time for five minutes", "Talk to animals for one hour", "Describe when you would use your power.", "How could your power help somebody else?"], ["THE LOST CITY", "Explore a city under the ocean", "Explore a city above the clouds", "Describe three things you might discover.", "What would you pack for your adventure?"], ["THE MAGIC LIBRARY", "Enter any book as a character", "Meet the author of any book", "Name a book and explain your decision.", "What question would you ask or what would you do first?"], ["THE PERFECT PET", "Adopt a tiny dragon", "Adopt a talking fox", "Explain how you would care for your pet.", "What funny problem might happen?"], ["THE TIME CAPSULE", "Send one message to your future self", "Receive one message from your future self", "Explain what your message would say.", "How could this message change your decisions today?"], ["THE WORLD CHALLENGE", "Make every city greener", "Make every school more creative", "Explain which change would help people most.", "Suggest one practical step to begin."], ["THE INVENTION LAB", "Invent shoes that let you fly", "Invent a bag that carries anything", "Describe how your invention works.", "Who would benefit most from it?"], ["THE MYSTERY ISLAND", "Take a map that changes every hour", "Take a compass that speaks in riddles", "Explain how you would find your way.", "What would you do if your tool stopped working?"], ["THE TALENT SWITCH", "Become an amazing musician overnight", "Become an amazing scientist overnight", "Describe how you would use your talent.", "What would you still need to practise?"], ["THE FINAL WISH", "Give everyone one extra hour each day", "Give everyone one new skill of their choice", "Defend your choice with two examples.", "Could your wish have an unexpected consequence?"]];
let i=0,score=0,teamScores=[0,0],selected=null,awarded=false;const $=id=>document.getElementById(id);
function team(){return i%2}
function render(){if(i>=questions.length){$('round').textContent='ALL CHALLENGES COMPLETE!';$('fill').style.width='100%';$('content').innerHTML='<div class="end"><h2>🏆 Brilliant thinking!</h2><p>'+($('mode').value==='teams'?'Team A: '+teamScores[0]+' ⭐ &nbsp; | &nbsp; Team B: '+teamScores[1]+' ⭐':'Your speaking score: '+score+' / 12 ⭐')+'</p><p>There are no wrong choices when you can explain your ideas!</p></div>';return}selected=null;awarded=false;let q=questions[i];$('round').textContent='CHALLENGE '+(i+1)+' / 12';$('fill').style.width=(i/12*100)+'%';$('scenario').textContent=q[0];$('a').innerHTML='<span class="letter">OPTION A</span>'+q[1];$('b').innerHTML='<span class="letter">OPTION B</span>'+q[2];$('a').classList.remove('selected');$('b').classList.remove('selected');$('challenge').innerHTML='<h3>YOUR MISSION</h3><p>Choose A or B. Then explain your choice in English!</p>';$('award').disabled=true;$('next').disabled=true;updateScore()}
function updateScore(){$('score').textContent=$('mode').value==='teams'?'Team A: '+teamScores[0]+' ⭐ | Team B: '+teamScores[1]+' ⭐':'⭐ Score: '+score}
function choose(k){if(awarded)return;selected=k;let q=questions[i];$('a').classList.toggle('selected',k===0);$('b').classList.toggle('selected',k===1);$('challenge').innerHTML='<h3>🎤 DEFEND YOUR CHOICE</h3><p><strong>'+q[3]+'</strong></p><p>✨ Bonus discussion: '+q[4]+'</p>';$('award').disabled=false;$('next').disabled=false}
$('a').onclick=()=>choose(0);$('b').onclick=()=>choose(1);
$('award').onclick=()=>{if(selected===null||awarded)return;awarded=true;score++;teamScores[team()]++;$('award').disabled=true;$('challenge').insertAdjacentHTML('beforeend','<p style="color:#098d83;font-weight:900">✓ Speaking point awarded!</p>');updateScore()};
$('next').onclick=()=>{i++;render()};$('reset').onclick=()=>location.reload();$('mode').onchange=updateScore;render();
</script></body></html>
