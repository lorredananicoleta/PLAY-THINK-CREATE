<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Speaking Roulette — 8 Challenges</title><style>body{margin:0;background:radial-gradient(circle at top,#225a4a,#092b28);font-family:Arial,sans-serif;color:white;text-align:center}h1{margin:22px 0 4px;font-size:clamp(25px,4vw,43px)}.sub{color:#f9db9c}.wrap{max-width:900px;margin:auto;padding:12px}.wheelbox{position:relative;width:min(78vw,490px);margin:18px auto}canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 18px #001a16)}.pointer{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:35px solid #ffd166;filter:drop-shadow(0 2px 2px #000)}button{background:#ffd166;color:#18392e;border:0;border-radius:30px;padding:14px 24px;font-weight:bold;font-size:17px;cursor:pointer;margin:5px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#f3f5ee}.prompt{background:#fff;color:#163e35;border-radius:18px;padding:19px;min-height:62px;font-size:clamp(18px,2.8vw,26px);font-weight:bold;display:flex;align-items:center;justify-content:center}.status{min-height:27px;color:#ffe8a7}.small{font-size:13px;color:#d5e7dc}.timer{font-size:30px;font-weight:bold;color:#ffd166}</style></head><body><div class="wrap"><h1>🎄 Christmas Speaking Roulette 🎅</h1><div class="sub">8 magical speaking challenges • Spin, listen and speak!</div><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="600" height="600"></canvas></div><button id="spin">🎡 SPIN THE WHEEL</button><button class="secondary" id="repeat">🔊 Repeat challenge</button><button class="secondary" id="voice">🔈 Voice: ON</button><div class="status" id="status">Ready for a Christmas challenge?</div><div class="prompt" id="prompt">Press SPIN to discover your challenge!</div><div style="margin-top:12px"><button class="secondary" id="startTimer">⏱ Start 45 seconds</button><span class="timer" id="timer">00:45</span></div><p class="small">English voice uses your browser's speech synthesis. For best results, use Chrome or Edge with sound enabled.</p></div><script>
const prompts=["If you were Santa for a day, what would you change?","Describe the funniest Christmas gift you can imagine.","Convince us that Christmas should happen twice a year.","What would happen if Santa got stuck in a lift?","Invent a new Christmas tradition for your school.","Would you rather spend Christmas on a tropical island or in an ice hotel?","Describe Christmas without using the words Santa, snow or gifts.","If you could give the world one magical gift, what would it be?"];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spinBtn=document.getElementById('spin'),promptEl=document.getElementById('prompt'),statusEl=document.getElementById('status');let angle=0,spinning=false,selected=-1,voiceOn=true,timerId=null,remaining=[],firstSpin=true;const TWO=Math.PI*2,step=TWO/8;
function draw(){ctx.clearRect(0,0,600,600);ctx.save();ctx.translate(300,300);for(let i=0;i<8;i++){let start=angle-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,278,start,start+step);ctx.closePath();ctx.fillStyle=i%2?'#b83d48':'#16775d';ctx.fill();ctx.strokeStyle='#fff2d0';ctx.lineWidth=4;ctx.stroke();let mid=start+step/2;ctx.save();ctx.rotate(mid);ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText(String(i+1),205,10);ctx.restore();}ctx.beginPath();ctx.arc(0,0,65,0,TWO);ctx.fillStyle='#ffe0a0';ctx.fill();ctx.fillStyle='#174d3b';ctx.textAlign='center';ctx.font='bold 25px Arial';ctx.fillText('SPIN',0,9);ctx.restore();}draw();
function chooseVoice(){let v=speechSynthesis.getVoices();return v.find(x=>x.lang==='en-GB'&&/Google|Microsoft|Natural|Sonia|Libby/i.test(x.name))||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'))||null;}
function say(t){return new Promise(resolve=>{if(!voiceOn||!('speechSynthesis'in window)){resolve();return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.88;u.pitch=1.03;let v=chooseVoice();if(v)u.voice=v;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);});}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}
spinBtn.onclick=async()=>{if(spinning)return;spinning=true;spinBtn.disabled=true;selected=-1;promptEl.textContent='🎅 Santa is choosing your challenge...';statusEl.textContent='Get ready!';if(firstSpin)await say('Are you ready for your Christmas challenge? Three, two, one... Spin!');if(remaining.length===0){remaining=[0,1,2,3,4,5,6,7];statusEl.textContent="A new round of eight challenges begins!";}let pick=Math.floor(Math.random()*remaining.length),target=remaining.splice(pick,1)[0],finalMod=(TWO-((target+.5)*step)%TWO)%TWO,current=((angle%TWO)+TWO)%TWO,delta=((finalMod-current+TWO)%TWO)+TWO*(5+Math.floor(Math.random()*3));let initial=angle,start=performance.now(),duration=4800;function frame(now){let t=Math.min((now-start)/duration,1),ease=1-Math.pow(1-t,4);angle=initial+delta*ease;draw();if(t<1)requestAnimationFrame(frame);else{selected=target;spinning=false;spinBtn.disabled=false;promptEl.textContent=prompts[target];statusEl.textContent='✨ Challenge '+(target+1)+' — your turn! '+remaining.length+' unused challenges left in this round.';say((firstSpin?'Ho, ho, ho! Here is your challenge! ':'')+prompts[target]);firstSpin=false;}}requestAnimationFrame(frame);};
document.getElementById('repeat').onclick=()=>{if(selected>=0)say(prompts[selected]);else say('Spin the wheel to get your Christmas challenge!')};document.getElementById('voice').onclick=e=>{voiceOn=!voiceOn;e.target.textContent=voiceOn?'🔈 Voice: ON':'🔇 Voice: OFF';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();};document.getElementById('startTimer').onclick=()=>{clearInterval(timerId);let n=45,el=document.getElementById('timer');el.textContent='00:45';timerId=setInterval(()=>{n--;el.textContent='00:'+String(Math.max(n,0)).padStart(2,'0');if(n<=0){clearInterval(timerId);say('Time is up! Well done!');}},1000)};if('speechSynthesis'in window)speechSynthesis.getVoices();
</script></body></html>
