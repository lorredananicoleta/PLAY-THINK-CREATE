<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santa's Magic Hat – Christmas Taboo</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#fff8e7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#245e69 0,#12364b 48%,#071b2e 100%);overflow-x:hidden}body:before{content:'✦  ❄     ✧     ❄       ✦       ❄     ✧     ❄       ✦';position:fixed;top:0;left:0;width:100%;text-align:center;font-size:35px;letter-spacing:30px;color:#cde7f1;opacity:.45;pointer-events:none}.layout{max-width:1240px;margin:auto;padding:20px 24px 30px}header{text-align:center}h1{font-size:clamp(32px,4.3vw,60px);margin:6px 0 0;color:#ffe0a2;text-shadow:0 4px 0 #852333,0 6px 20px #000}header p{margin:5px;color:#e7f8ef;font-size:19px}.main{display:grid;grid-template-columns:minmax(200px,1fr) minmax(380px,2fr) minmax(190px,1fr);gap:18px;align-items:center;margin-top:16px}.panel{background:#fff6e6;color:#173e36;border:5px solid #dfb66e;border-radius:22px;padding:20px;box-shadow:0 12px 24px #0005}.panel h2{margin:0 0 12px;color:#9d2033;font-size:24px}.panel li{margin:10px 0;line-height:1.3}.stage{height:540px;position:relative;display:flex;justify-content:center;align-items:flex-end;isolation:isolate}.glow{position:absolute;bottom:25px;width:340px;height:150px;border-radius:50%;background:#ffcb54;filter:blur(55px);opacity:.5}.hat{position:absolute;bottom:32px;width:330px;height:260px;cursor:pointer;z-index:3;filter:drop-shadow(0 14px 15px #0008);transform-origin:50% 90%;transition:filter .2s}.hat:hover{filter:drop-shadow(0 14px 18px #ffe285)}.hat-body{position:absolute;bottom:25px;left:45px;width:240px;height:215px;background:linear-gradient(120deg,#a70b2a,#ec2342 45%,#8f0b2b);border-radius:90px 90px 30px 30px;border:5px solid #ffb5bd;box-shadow:inset -25px -4px 25px #700a2a}.hat-brim{position:absolute;bottom:0;left:0;width:330px;height:78px;border-radius:50%;background:linear-gradient(#fae9d1,#c99b83 70%,#a60f2e 72%);border:5px solid #fff4db;box-shadow:0 9px 0 #85122d}.hat-opening{position:absolute;bottom:47px;left:29px;width:272px;height:49px;border-radius:50%;background:radial-gradient(ellipse,#ffdd77,#ad2a18 58%,#460d1c 78%);z-index:4;box-shadow:0 0 26px #ffd36a}.hat-band{position:absolute;bottom:91px;left:49px;width:233px;height:48px;background:#192b2a;border-top:5px solid #f9db85;border-bottom:5px solid #f9db85;z-index:4}.buckle{position:absolute;bottom:94px;left:140px;width:52px;height:43px;border:9px solid #ffcd55;border-radius:8px;z-index:5}.ticket{position:absolute;bottom:86px;left:50%;width:min(360px,82%);min-height:290px;transform:translate(-50%,190px) scale(.55) rotate(-8deg);opacity:0;z-index:2;background:#fff7df;color:#193d35;border:7px double #d9a94d;border-radius:18px;padding:20px 16px;text-align:center;box-shadow:0 0 30px #ffe18b90,0 16px 20px #0007;pointer-events:none}.ticket h2{font-size:clamp(21px,2.4vw,31px);color:#146b4b;margin:13px 0 20px;overflow-wrap:anywhere}.ticket .small{font-size:13px;letter-spacing:2px;color:#9c6426;font-weight:800}.ticket .dont{color:#b71c39;font-weight:900;letter-spacing:1px}.forbidden{display:flex;flex-direction:column;gap:8px;margin-top:10px}.forbidden span{background:#b91f38;color:white;border-radius:25px;padding:8px 12px;font-size:18px;font-weight:bold}.ticket.reveal{animation:popcard 1.85s cubic-bezier(.2,.75,.15,1) forwards;pointer-events:auto}@keyframes popcard{0%{opacity:0;transform:translate(-50%,190px) scale(.55) rotate(-8deg)}15%{opacity:1}55%{transform:translate(-50%,-195px) scale(.88) rotate(8deg)}75%{transform:translate(-50%,-225px) scale(1.03) rotate(-3deg)}100%{opacity:1;transform:translate(-50%,-215px) scale(1) rotate(0)}}.hat.shake{animation:shake .9s ease-in-out}@keyframes shake{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-9deg)}40%,80%{transform:rotate(9deg)}}.sparkles{position:absolute;left:50%;bottom:130px;width:1px;height:1px;z-index:5;pointer-events:none}.spark{position:absolute;color:#ffe77b;font-size:27px;opacity:0}.spark.on{animation:fly 1.5s ease-out forwards}@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}.side{text-align:center}.timer{font-size:52px;font-weight:900;color:#a51e35;font-variant-numeric:tabular-nums;margin:8px 0}.status{font-size:16px;min-height:42px;color:#26594a}.button{display:block;width:100%;margin:10px auto;padding:14px 10px;border:0;border-radius:14px;background:linear-gradient(#268b5e,#0a5a42);color:white;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #073b2d}.button:hover{filter:brightness(1.1)}.button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:linear-gradient(#bd3950,#8d1831);box-shadow:0 5px 0 #5d0d1c}.hint{text-align:center;font-size:18px;margin-top:4px;color:#fce7b4}.progress{text-align:center;color:#f8ddab;margin-top:15px;font-size:17px}.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.flake{position:absolute;top:-30px;color:#fff9;font-size:20px;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(180deg)}}@media(max-width:900px){.main{grid-template-columns:1fr}.stage{height:540px;order:0}.instructions{order:1}.side{order:2}.panel{max-width:620px;margin:auto;width:100%}}@media(prefers-reduced-motion:reduce){.ticket.reveal{animation:none;opacity:1;transform:translate(-50%,-215px)}.hat.shake{animation:none}}

/* Compact widescreen presentation layout */
.layout{max-width:1420px;padding:8px 20px 16px}header h1{font-size:clamp(30px,4vw,54px)}header p{font-size:16px}
.main{display:flex;flex-direction:column;gap:0;margin-top:0}.stage{height:min(60vh,520px);min-height:390px;width:100%;max-width:760px}.control-area{width:min(100%,1100px);display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:0;z-index:10}.timer-row{display:flex;align-items:center;gap:20px;justify-content:center}.timer{font-size:clamp(28px,4vw,46px)!important;margin:0!important}.status{font-size:16px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;width:100%}.controls .button{width:auto;min-width:155px;flex:1 1 155px;max-width:225px;margin:0;padding:12px 10px;font-size:15px}.controls .sound{max-width:160px}.progress{text-align:center;margin-top:10px}
@media(max-width:750px){.stage{height:440px;min-height:440px}.controls .button{min-width:135px;font-size:13px}.timer-row{flex-direction:column;gap:0}.layout{padding:8px}}
</style></head><body><div class="snow" id="snow"></div><div class="layout"><header><h1>🎅 SANTA'S MAGIC HAT 🎩</h1><p>CHRISTMAS TABOO • Draw a secret word and avoid the forbidden words!</p></header><div class="main"><div class="stage"><div class="glow"></div><div class="sparkles" id="sparkles"></div><div class="ticket" id="ticket" aria-live="polite"><div class="small">✨ YOUR SECRET WORD ✨</div><h2 id="word">READY?</h2><div class="dont">🚫 DON'T SAY:</div><div class="forbidden" id="forbidden"></div></div><div class="hat" id="hat" role="button" tabindex="0" aria-label="Click to draw a magic ticket"><div class="hat-body"></div><div class="hat-band"></div><div class="buckle"></div><div class="hat-opening"></div><div class="hat-brim"></div></div></div><section class="control-area"><div class="timer-row"><div class="timer" id="timer">0:30</div><div class="status" id="status">Click the hat to begin!</div></div><div class="controls"><button class="button" id="draw">✨ DRAW A TICKET</button><button class="button secondary" id="start" disabled>▶ START 30 SEC</button><button class="button secondary" id="next">↻ NEXT CARD</button><button class="button secondary" id="reset">NEW GAME</button><button class="button secondary sound" id="sound" aria-pressed="true">🔊 SOUND ON</button></div></section></div><div class="progress" id="progress">20 secret tickets waiting</div></div><script>
const cards=[["REINDEER", "RUDOLPH", "SLEIGH", "ANTLERS"], ["CHRISTMAS PUDDING", "DESSERT", "FRUIT", "CAKE"], ["CHRISTMAS CRACKER", "PULL", "BANG", "PAPER"], ["SLEIGH", "REINDEER", "SANTA", "SNOW"], ["SNOWMAN", "SNOW", "CARROT", "WINTER"], ["CHRISTMAS CAROL", "SONG", "SING", "MUSIC"], ["SECRET SANTA", "GIFT", "SECRET", "NAME"], ["CHRISTMAS STOCKING", "SOCK", "FIREPLACE", "GIFTS"], ["SANTA CLAUS", "RED", "PRESENTS", "BEARD"], ["CHIMNEY", "SANTA", "ROOF", "FIREPLACE"]];
const el=id=>document.getElementById(id);
let soundOn=true,audioCtx=null;
function audio(){if(!soundOn)return null;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,when,duration,type='sine',gain=.13){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(gain,when+.015);g.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(g).connect(c.destination);o.start(when);o.stop(when+duration+.02)}
function magicSound(){const c=audio();if(!c)return;const t=c.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.105,.31,'sine',.11));}
function timeUpSound(){const c=audio();if(!c)return;const t=c.currentTime;[0,.28,.56].forEach((d,i)=>tone(i===2?392:523,t+d,.25,'square',.09));}
let deck=[],busy=false,remaining=30,interval=null;function shuffle(){deck=Array.from({length:cards.length},(_,i)=>i);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function stop(){clearInterval(interval);interval=null}function updateTimer(){el('timer').textContent='0:'+String(remaining).padStart(2,'0')}function sparks(){const box=el('sparkles');box.innerHTML='';for(let i=0;i<24;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%3===0?'✦':'✧';const angle=Math.random()*Math.PI*2,r=85+Math.random()*185;s.style.setProperty('--x',Math.cos(angle)*r+'px');s.style.setProperty('--y',-Math.abs(Math.sin(angle)*r)-20+'px');s.style.left='0';s.style.top='0';s.style.animationDelay=(Math.random()*.4)+'s';box.appendChild(s);requestAnimationFrame(()=>s.classList.add('on'))}}function draw(){if(busy)return;if(!deck.length){el('status').textContent='All 20 tickets used! Reset for another game.';return}busy=true;stop();remaining=30;updateTimer();el('start').disabled=true;el('draw').disabled=true;el('ticket').classList.remove('reveal');el('hat').classList.remove('shake');void el('ticket').offsetWidth;el('hat').classList.add('shake');el('status').textContent='Magic is happening...';const index=deck.pop(),card=cards[index];el('word').textContent=card[0];el('forbidden').replaceChildren(...card.slice(1).map(w=>{let s=document.createElement('span');s.textContent=w;return s}));sparks();setTimeout(()=>{el('ticket').classList.add('reveal');magicSound()},500);setTimeout(()=>{busy=false;el('start').disabled=false;el('draw').disabled=false;el('status').textContent='Read your ticket. Start the timer!';el('progress').textContent=deck.length+' secret tickets remaining'},2450)}function start(){if(interval||busy)return;el('start').disabled=true;el('status').textContent='Describe it — no forbidden words!';interval=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){stop();el('status').textContent="⏰ TIME'S UP! Next player!";timeUpSound();el('start').disabled=true}},1000)}function reset(){stop();remaining=30;updateTimer();shuffle();busy=false;el('ticket').classList.remove('reveal');el('hat').classList.remove('shake');el('start').disabled=true;el('draw').disabled=false;el('status').textContent='Click the hat to begin!';el('progress').textContent=cards.length+' secret tickets waiting'}el('hat').addEventListener('click',draw);el('hat').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();draw()}});el('draw').addEventListener('click',draw);el('start').addEventListener('click',start);el('next').addEventListener('click',draw);el('sound').addEventListener('click',()=>{soundOn=!soundOn;el('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';el('sound').setAttribute('aria-pressed',String(soundOn))});el('reset').addEventListener('click',reset);for(let i=0;i<22;i++){let f=document.createElement('span');f.className='flake';f.textContent=i%2?'❄':'✧';f.style.left=Math.random()*100+'%';f.style.animationDuration=8+Math.random()*11+'s';f.style.animationDelay=-Math.random()*18+'s';f.style.opacity=.15+Math.random()*.4;el('snow').appendChild(f)}reset();
</script></body></html>
