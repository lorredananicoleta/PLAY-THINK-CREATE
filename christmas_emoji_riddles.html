<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Emoji Riddles</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Trebuchet MS',Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 15%,#276d58,#0b302b 70%);display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:min(950px,100%);border:5px solid #e4ba60;border-radius:25px;background:#133f36;box-shadow:0 20px 70px #041e1a;padding:30px;text-align:center}.top{color:#ffe5a1;font-size:clamp(16px,2vw,24px);letter-spacing:2px;font-weight:bold}.heading{font-size:clamp(30px,5vw,54px);margin:12px 0;color:white;text-shadow:2px 3px #a12b37}.count{color:#ffe5a1;font-weight:bold}.emoji{font-size:clamp(42px,7vw,86px);background:#f9f3df;border:6px solid #cba74e;border-radius:22px;padding:30px 10px;margin:22px 0;min-height:210px;display:flex;justify-content:center;align-items:center;letter-spacing:6px;line-height:1.5}.category{color:#f9db91;text-transform:uppercase;letter-spacing:2px}.answer,.hint{background:#f7f0db;color:#184a39;border-radius:16px;padding:18px;margin:16px 0;font-size:clamp(19px,3vw,32px);font-weight:bold}.answer b{color:#b12c3a}.hint{font-size:20px;font-weight:normal}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}button{border:0;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:bold;cursor:pointer;background:#e7bd62;color:#183c31}button:hover{filter:brightness(1.08)}button:disabled{opacity:.4;cursor:default}.primary{background:#b52d3c;color:#fff}.progress{display:flex;gap:6px;margin-top:20px}.progress span{height:7px;flex:1;border-radius:10px;background:#456d61}.progress span.active{background:#ffd66d}.progress span.done{background:#91c7a0}.small{font-size:13px;color:#d3e5d9;margin-top:18px}</style></head><body><main class="wrap"><div class="top">🎄 CHALLENGE NO. 5 🎄</div><h1 class="heading">CHRISTMAS EMOJI RIDDLES</h1><div class="count" id="count"></div><div class="emoji" id="emoji"></div><div class="category" id="category"></div><div id="hint" class="hint" hidden></div><div id="answer" class="answer" hidden></div><div class="buttons"><button id="prev">◀ Previous</button><button id="hintbtn">💡 Show Hint</button><button class="primary" id="reveal">🎁 Reveal Answer</button><button id="next">Next ▶</button></div><div class="progress" id="progress"></div><div class="small">Guess aloud in English • Use the hint if needed • Reveal the answer to check</div></main><script>const qs=[{e:'🏠 👦 🚫 👨‍👩‍👧‍👦',a:'HOME ALONE',c:'Christmas movie',h:'A boy spends Christmas without his family.'},{e:'🔔 🔔 🔔 🎶',a:'JINGLE BELLS',c:'Christmas song',h:'A famous song about a sleigh ride.'},{e:'🦌 🔴 👃',a:'RUDOLPH THE RED-NOSED REINDEER',c:'Christmas character',h:'A very special reindeer.'},{e:'👹 🎄 🎁 🚫',a:'THE GRINCH',c:'Christmas character',h:'He wants to steal Christmas.'},{e:'🌙 🤫 ⭐ 🎶',a:'SILENT NIGHT',c:'Christmas carol',h:'A peaceful and traditional Christmas carol.'},{e:'❄️ 👨 ⛄',a:'SNOWMAN',c:'Winter symbol',h:'You can build one after a snowfall.'},{e:'🎅 🤫 🎁 🔄',a:'SECRET SANTA',c:'Christmas tradition',h:'A surprise gift-exchange game.'},{e:'🧦 🔥 🎁',a:'CHRISTMAS STOCKING',c:'Christmas tradition',h:'It is often hung near the fireplace.'},{e:'🍪 🫚 🏠',a:'GINGERBREAD HOUSE',c:'Christmas treat',h:'A sweet, edible holiday decoration.'},{e:'🥛 🍪 🎅 🌙',a:'MILK AND COOKIES FOR SANTA',c:'Christmas tradition',h:'A treat children leave out on Christmas Eve.'}];let i=0;const $=id=>document.getElementById(id);function draw(){let q=qs[i];$('count').textContent=`RIDDLE ${i+1} OF ${qs.length}`;$('emoji').textContent=q.e;$('category').textContent=q.c;$('hint').textContent=q.h;$('answer').innerHTML='<b>CORRECT!</b><br>'+q.a;$('hint').hidden=true;$('answer').hidden=true;$('hintbtn').textContent='💡 Show Hint';$('prev').disabled=i===0;$('next').textContent=i===qs.length-1?'Play Again ↻':'Next ▶';$('progress').innerHTML=qs.map((_,j)=>`<span class="${j===i?'active':j<i?'done':''}"></span>`).join('')} $('prev').onclick=()=>{if(i>0){i--;draw()}};$('next').onclick=()=>{i=(i+1)%qs.length;draw()};$('hintbtn').onclick=()=>{let el=$('hint');el.hidden=!el.hidden;$('hintbtn').textContent=el.hidden?'💡 Show Hint':'🙈 Hide Hint'};$('reveal').onclick=()=>{$('answer').hidden=false};draw();</script></body></html>
