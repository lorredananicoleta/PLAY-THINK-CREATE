let idx=0,autoplay=false,voiceOn=true,paused=false,token=0,voiceList=[];const $=id=>document.getElementById(id);const synth=window.speechSynthesis;
function loadVoices(){if(!synth)return;const old=$('voices').value;voiceList=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang));voiceList.sort((a,b)=>Number(/natural|online|google|microsoft/i.test(b.name))-Number(/natural|online|google|microsoft/i.test(a.name)));$('voices').innerHTML='';if(!voiceList.length){let o=new Option('Default English voice','');$('voices').add(o);return;}voiceList.forEach((v,i)=>$('voices').add(new Option(v.name+' ('+v.lang+')',String(i))));if([...$('voices').options].some(x=>x.value===old))$('voices').value=old;}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}
function cancelSpeech(){token++;if(synth)synth.cancel();}
function render(){const s=slides[idx];$('picture').src=s.image;$('country').textContent=s.country.toUpperCase();$('topic').textContent=s.title;$('fact').textContent=s.text;$('count').textContent=`Fact ${idx+1} of ${slides.length} • ${idx%3+1} of 3 for ${s.country}`;$('fill').style.width=((idx+1)/slides.length*100)+'%';$('dots').innerHTML='';slides.forEach((_,i)=>{let d=document.createElement('button');d.className='dot '+(i===idx?'current':i<idx?'done':'');d.title='Fact '+(i+1);d.setAttribute('aria-label','Go to fact '+(i+1));d.onclick=()=>go(i,false);$('dots').appendChild(d);});}
function read(){cancelSpeech();const my=token;if(!voiceOn||!synth){$('status').textContent='Showing fact '+(idx+1)+' (voice off)';if(autoplay)setTimeout(()=>{if(my===token)advance()},5200);return;}const s=slides[idx];let u=new SpeechSynthesisUtterance(s.country+'. '+s.title+'. '+s.text);u.lang='en-GB';u.rate=.87;u.pitch=1;const v=voiceList[Number($('voices').value)];if(v)u.voice=v;$('status').textContent='🔊 Reading fact '+(idx+1)+' of '+slides.length;u.onend=()=>{if(my!==token)return;if(autoplay)advance();else $('status').textContent='Finished reading.'};u.onerror=()=>{if(my!==token)return;$('status').textContent='Voice unavailable. You can use Next.';if(autoplay)setTimeout(()=>{if(my===token)advance()},4500)};synth.speak(u);}
function advance(){if(idx===slides.length-1){autoplay=false;$('play').textContent='▶ Play all';$('status').textContent='🎉 Presentation finished!';return;}idx++;render();read();}
function go(i,auto=false){autoplay=auto;paused=false;idx=Math.max(0,Math.min(slides.length-1,i));$('play').textContent=auto?'▶ Playing…':'▶ Play all';render();read();}
$('play').onclick=()=>{if(paused&&synth?.paused){paused=false;autoplay=true;synth.resume();$('play').textContent='▶ Playing…';$('status').textContent='Resumed';return;}go(idx===slides.length-1?0:idx,true)};
$('pause').onclick=()=>{autoplay=false;paused=true;if(synth?.speaking&&!synth.paused){synth.pause();$('status').textContent='⏸ Paused';}else{cancelSpeech();$('status').textContent='⏸ Paused';}$('play').textContent='▶ Resume'};
$('prev').onclick=()=>go(idx-1,false);$('next').onclick=()=>go(idx+1,false);$('again').onclick=()=>{autoplay=false;paused=false;read()};$('sound').onclick=()=>{voiceOn=!voiceOn;$('sound').textContent=voiceOn?'🔈 Voice on':'🔇 Voice off';if(!voiceOn){autoplay=false;cancelSpeech();$('status').textContent='Voice off';}else read()};$('voices').onchange=()=>{if(voiceOn)read()};render();
</script></body></html>
